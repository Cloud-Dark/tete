name = "tete"
main = "worker/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Markdown docs are bundled into the Worker as text and served at /README.md, /AGENT.md, /api.md.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

# Static web UI (client/). The Worker handles only the paths listed in run_worker_first;
# everything else is served directly from the asset store.
[assets]
directory = "./client"
binding = "ASSETS"
run_worker_first = ["/", "/api", "/api/*", "/file/*", "/mcp", "/mcp/*", "/oauth/*", "/.well-known/*", "/README.md", "/AGENT.md", "/api.md"]

# Both hostnames serve the same Worker (UI + API). Uncomment after the zone exists in your account.
# routes = [
#   { pattern = "tete.apipedia.id", custom_domain = true },
#   { pattern = "tetein.apipedia.id", custom_domain = true },
# ]

# File metadata + runtime config. Create with: wrangler d1 create tete
# then paste the printed database_id below.
[[d1_databases]]
binding = "DB"
database_name = "tete"
database_id = "15b26207-de6b-4365-b5a0-6913ccaf9e93"
migrations_dir = "migrations"

# Optional (needs a free cron slot or the Paid plan; the Free plan allows 5 cron triggers per account).
# Without it, expired files are still 404 immediately and are purged in the background after uploads
# (worker/index.js maybePurge). Uncomment to also purge on a schedule:
# [triggers]
# crons = ["*/30 * * * *"]

# Defaults. The admin Config tab overrides the first four at runtime (stored in D1).
[vars]
DEFAULT_EXPIRATION_MS = "3600000"
MAX_FILE_SIZE_BYTES = "26214400"
MAX_FILES_PER_UPLOAD = "10"
# Soft cap on everything stored (bytes). 1 GiB matches the Supabase Free plan storage allowance (verify on supabase.com).
STORAGE_QUOTA_BYTES = "1073741824"
FILE_WHITELIST = ""
PBKDF2_ITERATIONS = "100000"
# Two hostnames, one Worker: frontend (UI + share page) and API host (API, MCP, integrators).
FRONTEND_HOST = "tete.apipedia.id"
API_HOST = "tetein.apipedia.id"
# File content lives in a private Supabase Storage bucket named "tete" (see docs/18_INSTALLATION.md).
# Project URL only; the service key is a secret. Never exposed to browsers.
SUPABASE_URL = "https://kheniasmdqflwawtopip.supabase.co"

# Secrets (never in this file):
#   wrangler secret put SESSION_SECRET   # >= 32 random chars, signs cookies
#   wrangler secret put ADMIN_PASSWORD   # initial admin password (replaced once changed in the UI)
#   wrangler secret put SUPABASE_SERVICE_KEY   # service_role key of the Supabase project
# For local dev copy .dev.vars.example to .dev.vars.

[observability]
enabled = true
[observability.logs]
head_sampling_rate = 0.1
