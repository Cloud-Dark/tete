<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File - TETE</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📄</text></svg>">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/file-view.css">
</head>
<body>
  <div class="file-view-container">
    <header class="file-header">
      <a href="/" class="back-link">← Back</a>
      <h1>File Details</h1>
    </header>

    <div class="file-card">
      <!-- Loading State -->
      <div id="loadingState" class="loading-state">
        <div class="spinner"></div>
        <p>Loading file information...</p>
      </div>

      <!-- File Info Content -->
      <div id="fileInfo" class="file-info" style="display: none;">
        <div class="file-info-header">
          <div class="file-icon" id="fileIcon">📄</div>
          
          <div class="file-details">
            <h2 class="file-name" id="fileName">-</h2>
            <p class="file-id" id="fileId">-</p>
            
            <div class="file-meta">
              <div class="meta-item">
                <span class="meta-label">Size</span>
                <span class="meta-value" id="fileSize">-</span>
              </div>
              <div class="meta-item">
                <span class="meta-label">Uploaded</span>
                <span class="meta-value" id="uploadDate">-</span>
              </div>
              <div class="meta-item">
                <span class="meta-label">Expires</span>
                <span class="meta-value" id="expiryDate">-</span>
              </div>
              <div class="meta-item">
                <span class="meta-label">Status</span>
                <span class="meta-value" id="fileStatus">-</span>
              </div>
            </div>
          </div>
        </div>

        <div class="file-actions">
          <button class="btn" onclick="handleDownload()" id="downloadBtn">
            ⬇️ Download
          </button>
          <button class="btn btn-ghost" onclick="copyShareLink()">
            📋 Copy Link
          </button>
        </div>
      </div>

      <!-- Error State -->
      <div id="errorState" class="error-state" style="display: none;">
        <div class="error-icon">📄</div>
        <h2>File Not Found</h2>
        <p>This file may have been deleted or never existed.</p>
        <a href="/" class="btn">Go to Home</a>
      </div>
    </div>
  </div>

  <!-- Password Modal for Encrypted Files -->
  <div id="passwordModal" class="modal-overlay">
    <div class="modal">
      <h3>🔐 This file is encrypted</h3>
      <p>Enter encryption key to download</p>
      <input type="password" id="modalPassword" placeholder="Encryption key" onkeypress="handlePasswordKeypress(event)">
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closePasswordModal()">Cancel</button>
        <button class="btn" onclick="submitPassword()">Download</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast"></div>

  <script src="/js/file-view.js"></script>
</body>
</html>
